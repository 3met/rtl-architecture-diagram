<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title" width="1240" height="480" viewBox="0 0 1240 480">
<title id="diagram-title">Transposition Table Microarchitecture</title>
<defs>
<style>
    .bg{fill:#ffffff}
    .title{font:650 20px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a;text-anchor:middle}
    .block{fill:#f8fafc;stroke:#334155;stroke-width:1.7}
    .node.bigger .block{stroke-width:2}
    .node.smaller .block{stroke-width:1.4}
    .module{fill:#eef2ff;stroke:#4f46e5}
    .logic,.alu,.adder,.subtractor,.addsub,.multiplier,.comparator,.and,.or,.xor,.not{fill:#fff7ed;stroke:#c2410c}
    .memory-shadow{fill:#ccfbf1;stroke:#0f766e;stroke-width:1.2}
    .memory,.fifo{fill:#ecfeff;stroke:#0f766e}
    .reg,.counter{fill:#eff6ff;stroke:#2563eb}
    .fsm,.arbiter{fill:#fdf2f8;stroke:#be185d}
    .fsm{stroke-dasharray:5 3}
    .mux,.demux{fill:#fefce8;stroke:#a16207}
    .io{fill:#f0fdf4;stroke:#15803d}
    .symbol-line{fill:none;stroke:#64748b;stroke-width:1.2}
    .clock-glyph{stroke:#2563eb;stroke-width:1.7}
    .operator-badge{fill:#fff;stroke:#c2410c;stroke-width:1.2}
    .operator{font:700 12px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#9a3412;text-anchor:middle}
    .operator.alu-operator{font-size:9px}
    .block-label{font:600 14px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a;text-anchor:middle}
    .block-label.bigger{font-size:15px;font-weight:650}
    .block-label.smaller{font-size:13px;font-weight:550}
    .subtitle{font:11px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#475569;text-anchor:middle}
    .subtitle.bigger{font-size:11.5px}
    .subtitle.smaller{font-size:10.5px}
    .group{fill-opacity:.58;stroke-width:1.1;stroke-dasharray:6 4}
    .group.group-0{fill:#eff6ff;stroke:#93c5fd}
    .group.group-1{fill:#f0fdf4;stroke:#86efac}
    .group.group-2{fill:#fff7ed;stroke:#fdba74}
    .group.group-3{fill:#faf5ff;stroke:#d8b4fe}
    .group-label{font:650 13px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#334155}
    .edge{fill:none;stroke:#475569;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:butt}
    .edge.data{stroke:#2563eb}
    .edge.bus{stroke-width:3}
    .edge.control{stroke:#a16207;stroke-dasharray:6 4}
    .edge.clock{stroke:#7c3aed;stroke-dasharray:2 3}
    .edge.response{stroke:#0f766e}
    .arrowhead{stroke:none}
    .arrowhead.data{fill:#2563eb}
    .arrowhead.control{fill:#a16207}
    .arrowhead.clock{fill:#7c3aed}
    .arrowhead.response{fill:#0f766e}
    .edge-label{font:500 10.5px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#334155;text-anchor:middle}
    .edge-label.data{fill:#1d4ed8}
    .edge-label.control{fill:#854d0e}
    .edge-label.clock{fill:#6d28d9}
    .edge-label.response{fill:#0f766e}
    .edge-label-bg{fill:#fff;fill-opacity:.98;stroke:#cbd5e1;stroke-width:.7}
    .label-leader{fill:none;stroke:#cbd5e1;stroke-width:.9}
    </style>
</defs>
<rect x="0" y="0" width="1240" height="480" class="bg"/>
<text x="620.0" y="32" class="title">Transposition Table Microarchitecture</text>
<rect x="818" y="177" width="380" height="116" rx="10" class="group group-0"/>
<text x="828" y="194" class="group-label">Frontend</text>
<rect x="337" y="343" width="134" height="68" rx="4" class="memory-shadow"/>
<polyline points="194,230 230,230 230,290 800,290 800,230 829,230" class="edge data bus"/>
<polyline points="966,240 1000,240 1000,260 1040,260" class="edge data"/>
<polyline points="1050,240 1010,240 1010,190 500,190 500,230 474,230" class="edge data"/>
<polyline points="380,274 380,326" class="edge data"/>
<polyline points="410,336 410,284" class="edge response"/>
<polyline points="464,250 600,250" class="edge data"/>
<polyline points="610,230 570,230 570,430 200,430 200,250 198.8,250" class="edge response"/>
<polyline points="464,110 1020,110 1020,220 1040,220" class="edge control"/>
<polyline points="400,144 400,196" class="edge control"/>
<g class="node normal">
<rect x="60" y="206" width="134" height="68" rx="6" class="block module"/>
<text x="127" y="244.0" class="block-label">Search Threads</text>
</g>
<g class="node normal">
<rect x="840" y="209" width="126" height="62" rx="5" class="block fifo"/>
<line x1="853" y1="219" x2="853" y2="261" class="symbol-line"/>
<line x1="953" y1="219" x2="953" y2="261" class="symbol-line"/>
<text x="903" y="244.0" class="block-label">Request FIFO</text>
</g>
<g class="node normal">
<polygon points="1060,209 1166,209 1176,240 1166,271 1060,271 1050,240" class="block arbiter"/>
<text x="1113" y="244.0" class="block-label">Arbiter</text>
</g>
<g class="node normal">
<rect x="330" y="206" width="134" height="68" rx="6" class="block logic"/>
<text x="397" y="234.0" class="block-label">TT Pipeline</text>
<text x="397" y="254.0" class="subtitle">probe / replace</text>
</g>
<g class="node normal">
<rect x="330" y="336" width="134" height="68" rx="4" class="block memory"/>
<text x="397" y="374.0" class="block-label">TT Storage</text>
</g>
<g class="node normal">
<rect x="610" y="206" width="134" height="68" rx="5" class="block fifo"/>
<line x1="623" y1="216" x2="623" y2="264" class="symbol-line"/>
<line x1="731" y1="216" x2="731" y2="264" class="symbol-line"/>
<text x="677" y="244.0" class="block-label">Response FIFO</text>
</g>
<g class="node normal">
<rect x="330" y="76" width="134" height="68" rx="12" class="block fsm"/>
<text x="397" y="114.0" class="block-label">TT Control</text>
</g>
<polygon points="829,235.5 840,230 829,224.5" class="arrowhead data bus"/>
<polygon points="1040,265 1050,260 1040,255" class="arrowhead data"/>
<polygon points="474,225 464,230 474,235" class="arrowhead data"/>
<polygon points="375,326 380,336 385,326" class="arrowhead data"/>
<polygon points="415,284 410,274 405,284" class="arrowhead response"/>
<polygon points="600,255 610,250 600,245" class="arrowhead data"/>
<polygon points="198.8,247.6 194,250 198.8,252.4" class="arrowhead response"/>
<polygon points="1040,225 1050,220 1040,215" class="arrowhead control"/>
<polygon points="395,196 400,206 405,196" class="arrowhead control"/>
<rect x="457.0" y="298.0" width="92.0" height="18.0" rx="5" class="edge-label-bg"/>
<text x="503.0" y="310.0" class="edge-label data">TT request · 96b</text>
<rect x="335.0" y="309.0" width="37.0" height="18.0" rx="5" class="edge-label-bg"/>
<text x="353.5" y="321.0" class="edge-label data">entry</text>
<polyline points="410,330 472,330" class="label-leader"/>
<rect x="472.0" y="321.0" width="56.2" height="18.0" rx="5" class="edge-label-bg"/>
<text x="500.1" y="333.0" class="edge-label response">read data</text>
<polyline points="513,250 513,258" class="label-leader"/>
<rect x="481.9" y="258.0" width="62.2" height="18.0" rx="5" class="edge-label-bg"/>
<text x="513.0" y="270.0" class="edge-label data">hit / score</text>
</svg>

<line x1="805" y1="300" x2="805" y2="296" class="label-leader"/>
<rect x="784.0" y="280.0" width="42.0" height="16.0" rx="3" class="edge-label-bg"/>
<text x="805.0" y="292.0" class="edge-label">entry</text>
<line x1="760" y1="301" x2="756" y2="301" class="label-leader"/>
<rect x="688.4" y="293.0" width="67.6" height="16.0" rx="3" class="edge-label-bg"/>
<text x="722.2" y="305.0" class="edge-label">read data</text>
<line x1="896" y1="240" x2="896" y2="216" class="label-leader"/>
<rect x="855.8" y="200.0" width="80.4" height="16.0" rx="3" class="edge-label-bg"/>
<text x="896.0" y="212.0" class="edge-label">hit / score</text>
</svg>

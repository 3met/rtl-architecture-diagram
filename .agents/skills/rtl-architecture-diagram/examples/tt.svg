<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title" width="980" height="470" viewBox="0 0 980 470">
<title id="diagram-title">Transposition Table Microarchitecture</title>
<defs>
<style>
    .bg{fill:#ffffff}
    .title{font:650 20px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a;text-anchor:middle}
    .block{fill:#f8fafc;stroke:#334155;stroke-width:1.7}
    .node.bigger .block{stroke-width:2}
    .node.smaller .block{stroke-width:1.4}
    .module{fill:#eef2ff;stroke:#4f46e5}
    .logic,.alu,.adder,.subtractor,.addsub,.multiplier,.comparator,.and,.or,.xor,.not{fill:#fff7ed;stroke:#c2410c}
    .memory-shadow{fill:#ccfbf1;stroke:#0f766e;stroke-width:1.2}
    .memory,.fifo{fill:#ecfeff;stroke:#0f766e}
    .reg,.counter{fill:#eff6ff;stroke:#2563eb}
    .fsm,.arbiter{fill:#fdf2f8;stroke:#be185d}
    .fsm{stroke-dasharray:5 3}
    .mux,.demux{fill:#fefce8;stroke:#a16207}
    .io{fill:#f0fdf4;stroke:#15803d}
    .symbol-line{fill:none;stroke:#64748b;stroke-width:1.2}
    .clock-glyph{stroke:#2563eb;stroke-width:1.7}
    .operator-badge{fill:#fff;stroke:#c2410c;stroke-width:1.2}
    .operator{font:700 12px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#9a3412;text-anchor:middle}
    .operator.alu-operator{font-size:9px}
    .block-label{font:600 14px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a;text-anchor:middle}
    .block-label.bigger{font-size:15px;font-weight:650}
    .block-label.smaller{font-size:13px;font-weight:550}
    .subtitle{font:11px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#475569;text-anchor:middle}
    .subtitle.bigger{font-size:11.5px}
    .subtitle.smaller{font-size:10.5px}
    .group{fill-opacity:.58;stroke-width:1.1;stroke-dasharray:6 4}
    .group.group-0{fill:#eff6ff;stroke:#93c5fd}
    .group.group-1{fill:#f0fdf4;stroke:#86efac}
    .group.group-2{fill:#fff7ed;stroke:#fdba74}
    .group.group-3{fill:#faf5ff;stroke:#d8b4fe}
    .group-label{font:650 13px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#334155}
    .group-label-bg{fill:#fff;fill-opacity:.96}
    .edge{fill:none;stroke:#475569;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:butt}
    .edge.data{stroke:#2563eb}
    .edge.bus{stroke-width:3}
    .edge.control{stroke:#a16207;stroke-dasharray:6 4}
    .edge.clock{stroke:#7c3aed;stroke-dasharray:2 3}
    .edge.response{stroke:#0f766e}
    .arrowhead{stroke:none}
    .arrowhead.data{fill:#2563eb}
    .arrowhead.control{fill:#a16207}
    .arrowhead.clock{fill:#7c3aed}
    .arrowhead.response{fill:#0f766e}
    .edge-label{font:500 10.5px Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#334155;text-anchor:middle}
    .edge-label.data{fill:#1d4ed8}
    .edge-label.control{fill:#854d0e}
    .edge-label.clock{fill:#6d28d9}
    .edge-label.response{fill:#0f766e}
    .edge-label-bg{fill:#fff;fill-opacity:.98;stroke:#cbd5e1;stroke-width:.7}
    .label-leader-halo{fill:none;stroke:#ffffff;stroke-width:4}
    .label-leader{fill:none;stroke:#cbd5e1;stroke-width:.9}
    </style>
</defs>
<rect x="0" y="0" width="980" height="470" class="bg"/>
<text x="490.0" y="32" class="title">Transposition Table Microarchitecture</text>
<rect x="548" y="167" width="390" height="116" rx="10" class="group group-0"/>
<rect x="69" y="343" width="134" height="68" rx="4" class="memory-shadow"/>
<polyline points="474,370 510,370 510,280 630,280 630,272" class="edge data bus"/>
<polyline points="696,230 780,230" class="edge data"/>
<polyline points="830,199 830,160 150,160 150,186" class="edge data"/>
<polyline points="110,264 110,326" class="edge data"/>
<polyline points="140,336 140,274" class="edge response"/>
<polyline points="194,230 330,230" class="edge data"/>
<polyline points="410,264 410,326" class="edge response"/>
<polyline points="196,110 870,110 870,189" class="edge control"/>
<polyline points="120,144 120,186" class="edge control"/>
<g class="node normal">
<rect x="340" y="336" width="134" height="68" rx="6" class="block module"/>
<text x="407" y="374.0" class="block-label">Search Threads</text>
</g>
<g class="node normal">
<rect x="570" y="199" width="126" height="62" rx="5" class="block fifo"/>
<line x1="583" y1="209" x2="583" y2="251" class="symbol-line"/>
<line x1="683" y1="209" x2="683" y2="251" class="symbol-line"/>
<text x="633" y="234.0" class="block-label">Request FIFO</text>
</g>
<g class="node normal">
<polygon points="800,199 906,199 916,230 906,261 800,261 790,230" class="block arbiter"/>
<text x="853" y="234.0" class="block-label">Arbiter</text>
</g>
<g class="node normal">
<rect x="60" y="196" width="134" height="68" rx="6" class="block logic"/>
<text x="127" y="224.0" class="block-label">TT Pipeline</text>
<text x="127" y="244.0" class="subtitle">probe / replace</text>
</g>
<g class="node normal">
<rect x="62" y="336" width="134" height="68" rx="4" class="block memory"/>
<text x="129" y="374.0" class="block-label">TT Storage</text>
</g>
<g class="node normal">
<rect x="340" y="196" width="134" height="68" rx="5" class="block fifo"/>
<line x1="353" y1="206" x2="353" y2="254" class="symbol-line"/>
<line x1="461" y1="206" x2="461" y2="254" class="symbol-line"/>
<text x="407" y="234.0" class="block-label">Response FIFO</text>
</g>
<g class="node normal">
<rect x="62" y="76" width="134" height="68" rx="12" class="block fsm"/>
<text x="129" y="114.0" class="block-label">TT Control</text>
</g>
<polygon points="635.5,272 630,261 624.5,272" class="arrowhead data bus"/>
<polygon points="780,235 790,230 780,225" class="arrowhead data"/>
<polygon points="145,186 150,196 155,186" class="arrowhead data"/>
<polygon points="105,326 110,336 115,326" class="arrowhead data"/>
<polygon points="145,274 140,264 135,274" class="arrowhead response"/>
<polygon points="330,235 340,230 330,225" class="arrowhead data"/>
<polygon points="405,326 410,336 415,326" class="arrowhead response"/>
<polygon points="865,189 870,199 875,189" class="arrowhead control"/>
<polygon points="115,186 120,196 125,186" class="arrowhead control"/>
<rect x="555.0" y="170.0" width="64.6" height="19.0" rx="3" class="group-label-bg"/>
<text x="558.0" y="184.0" class="group-label">Frontend</text>
<rect x="524.0" y="288.0" width="92.0" height="18.0" rx="5" class="edge-label-bg"/>
<text x="570.0" y="300.0" class="edge-label data">TT request · 96b</text>
<rect x="65.0" y="292.0" width="37.0" height="18.0" rx="5" class="edge-label-bg"/>
<text x="83.5" y="304.0" class="edge-label data">entry</text>
<rect x="148.0" y="292.0" width="56.2" height="18.0" rx="5" class="edge-label-bg"/>
<text x="176.1" y="304.0" class="edge-label response">read data</text>
<rect x="235.9" y="204.0" width="62.2" height="18.0" rx="5" class="edge-label-bg"/>
<text x="267.0" y="216.0" class="edge-label data">hit / score</text>
</svg>

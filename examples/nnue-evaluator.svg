</g>
<g class="node bigger">
<rect x="950" y="423" width="203" height="94" rx="4" class="block memory"/>
<text x="1051" y="457.0" class="block-label bigger">Update-state memory</text>
<text x="1051" y="477.0" class="subtitle bigger">one 2 × 256 × 5-bit</text>
<text x="1051" y="491.0" class="subtitle bigger">word per thread</text>
</g>

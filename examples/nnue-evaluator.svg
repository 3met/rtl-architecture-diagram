<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title" width="1560" height="1070" viewBox="0 0 1560 1070">
<title id="diagram-title">NNUE evaluator hardware architecture (current RTL)</title>
<defs>
<style>
    .bg{fill:#ffffff}

<text x="662" y="295.5" class="block-label">transformer ROM</text>
<text x="662" y="315.5" class="subtitle">768 rows × 256</text>
<text x="662" y="329.5" class="subtitle">signed 2-bit weights</text>
</g>
<g class="node normal">
<rect x="938" y="96" width="140" height="68" rx="4" class="block memory"/>
<text x="1008" y="124.0" class="block-label">Accumulator bias</text>
